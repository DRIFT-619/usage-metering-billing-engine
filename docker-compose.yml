services:
  postgres:
    image: postgres:16-alpine
    container_name: billing-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing_engine
    ports:
      - "5433:5432"
    volumes:
      - billing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  billing_pg_data:
